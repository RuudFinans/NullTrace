[package]
edition = "2024"
rust-version = "1.89"
name = "vodozemac"
version = "0.11.1"
authors = [
    "Damir Jelić <poljar@termina.org.uk>",
    "Denis Kasak <dkasak@termina.org.uk>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust implementation of Olm and Megolm"
readme = "README.md"
keywords = [
    "matrix",
    "chat",
    "messaging",
    "olm",
    "cryptography",
]
license = "Apache-2.0"
repository = "https://github.com/matrix-org/vodozemac"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = [
    "libolm-compat",
    "precomputed-tables",
]
experimental-session-config = []
insecure-pk-encryption = ["libolm-compat"]
libolm-compat = []
low-level-api = []
precomputed-tables = ["curve25519-dalek/precomputed-tables"]
wasm_js = ["getrandom/wasm_js"]

[lib]
name = "vodozemac"
path = "src/lib.rs"

[[bench]]
name = "megolm_benchmark"
path = "benches/megolm_benchmark.rs"
harness = false

[[bench]]
name = "olm_benchmark"
path = "benches/olm_benchmark.rs"
harness = false

