name: Security and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: npm
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: npm ci --ignore-scripts
      - run: python -m pytest -q
      - run: python -m pip_audit --disable-pip --no-deps -r requirements.txt
      - run: python -m bandit -r backend config.py -ll
      - run: npm audit
      - name: Verify committed ratchet assets
        working-directory: frontend/static/libs/ratchet-wasm
        run: sha256sum -c SHA256SUMS
      - run: npm test
      - run: npm run build:libs
      - run: git diff --exit-code -- frontend/static/libs
      - run: npx playwright install --with-deps chromium
      - name: Browser regression
        run: |
          python -m tests.browser_server > /tmp/nulltrace-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5017/healthz > /dev/null; then break; fi
            sleep 0.2
          done
          node tests/browser.test.mjs
  native-ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned development toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --target wasm32-unknown-unknown --no-self-update
      - name: Test native ratchet including compromise snapshots
        run: cargo +1.97.1 test --manifest-path crypto/ratchet-wasm/Cargo.toml --locked
      - name: Install pinned WASM generator and advisory checker
        run: |
          cargo +1.97.1 install wasm-bindgen-cli --version 0.2.129 --locked
          cargo +1.97.1 install cargo-audit --version 0.22.2 --locked
      - name: Check Rust dependency advisories
        run: cargo audit --file crypto/ratchet-wasm/Cargo.lock --deny warnings
      - name: Rebuild WASM from reviewed sources
        run: |
          cargo +1.97.1 build --manifest-path crypto/ratchet-wasm/Cargo.toml --target wasm32-unknown-unknown --release --locked
          wasm-bindgen crypto/ratchet-wasm/target/wasm32-unknown-unknown/release/nulltrace_ratchet.wasm --target web --out-dir frontend/static/libs/ratchet-wasm --out-name nulltrace_ratchet --no-typescript
      - name: Test rebuilt browser engine and group protocol
        run: npm test
